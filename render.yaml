services:
  - type: web
    name: edutrack-backend
    runtime: docker
    branch: main
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN_PATTERNS
        value: https://edutrackpe.vercel.app,https://*.vercel.app
      - key: SPRING_PROFILES_ACTIVE
        value: default
      - key: HIBERNATE_DDL_AUTO
        value: validate
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
