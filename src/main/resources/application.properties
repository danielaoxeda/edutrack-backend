spring.application.name=edutrack-backend

# ============================================
# Perfil DEFAULT: H2 en memoria (desarrollo)
# ============================================
spring.profiles.active=dev

# H2 Console (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuración H2
spring.datasource.url=jdbc:h2:mem:edutrack;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================
# Perfil MySQL (producción)
# ============================================
spring.config.activate.on-profile=mysql
