spring.application.name=edutrack-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

server.address=0.0.0.0
server.port=${PORT:8080}

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://edutrackpe.vercel.app,http://localhost:5173,http://127.0.0.1:5173}
